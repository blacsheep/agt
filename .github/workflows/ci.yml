name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Web tests start `agt web` and drive the CLI built at target/debug/agt.
      - run: cargo build -p agt-cli
      - run: node --test test/*.test.mjs
        working-directory: web

  # Released binaries also run on macOS and Windows. The web tests stay on
  # Linux: their scripted CLI is a Node script started as an executable.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # MCP test fixtures are Python scripts (`python` on Windows, `python3` elsewhere).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
