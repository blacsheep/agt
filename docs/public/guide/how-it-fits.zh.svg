  <rect class="node" x="416" y="128" width="160" height="40" rx="8"/>
  <text class="t" x="496.0" y="153.0">Agent</text>
  <rect class="ext" x="616" y="120" width="96" height="56" rx="8"/>
  <text class="s" x="664.0" y="144.0">MCP 服务、</text>
  <text class="s" x="664.0" y="160.0">Codex、Shell</text>
