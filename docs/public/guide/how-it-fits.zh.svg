  <text class="t" x="496.0" y="266.0">资源</text>
  <path class="edge" d="M117 44L174 44" marker-end="url(#a)"/>
  <text class="el" x="146" y="38" text-anchor="middle">对话</text>
  <path class="edge" d="M337 44L414 44" marker-end="url(#a)"/>
  <text class="el" x="376" y="38" text-anchor="middle">消息</text>
  <path class="edge" d="M496 65L496 126" marker-end="url(#a)"/>
  <text class="el" x="504" y="100" text-anchor="start">执行</text>
  <path class="edge" d="M415 148L262 148Q256 148 256 142L256 66" marker-end="url(#a)"/>
  <text class="el" x="264" y="140" text-anchor="start">回复 / 委派</text>
  <path class="edge" d="M577 148L614 148" marker-end="url(#a)"/>
  <text class="el" x="596" y="142" text-anchor="middle">调用</text>
