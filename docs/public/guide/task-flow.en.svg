<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 401" width="720" height="401" role="img" aria-labelledby="title desc">
  <title id="title">How a task flows</title>
  <desc id="desc">The lead requests a task; the scheduler queues it and runs the worker, posts the result in the task conversation and notifies the lead, which reviews it and files a report in the original conversation.</desc>
  <style>
svg { --bg: #fbfbfd; --band: #f2f1fb; --band-line: #dcd8f4; --node: #ffffff; --node-line: #b8b1ea;
  --ext: #f6f6f8; --ext-line: #c9c9d6; --dec: #fff8ec; --dec-line: #e2b766; --end: #eef6f1; --end-line: #8cc3a2;
  --stop: #fbefef; --stop-line: #e0a3a3; --title: #1f1f2e; --sub: #5d5d72; --label: #6e6a92; --line: #77778d;
  --accent: #7c6fe0; --life: #c7c4dc; --block: #8c88b0; }
@media (prefers-color-scheme: dark) {
  svg { --bg: #1c1c23; --band: #252432; --band-line: #3b3854; --node: #2d2c3c; --node-line: #5e57a8;
    --ext: #262630; --ext-line: #4a4a5e; --dec: #332c1f; --dec-line: #a3813f; --end: #1f2e26; --end-line: #4f8a66;
    --stop: #352223; --stop-line: #9a5c5c; --title: #ececf4; --sub: #a9a9bb; --label: #a39ee0; --line: #9a9ab0;
    --accent: #a99ff0; --life: #47455e; --block: #8f8ab8; }
}
text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.bg { fill: var(--bg); }
.band { fill: var(--band); stroke: var(--band-line); }
.band-label { fill: var(--label); font-size: 13px; font-weight: 600; }
.node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.2; }
.ext { fill: var(--ext); stroke: var(--ext-line); stroke-dasharray: 4 3; }
.dec { fill: var(--dec); stroke: var(--dec-line); stroke-width: 1.2; }
.end { fill: var(--end); stroke: var(--end-line); stroke-width: 1.2; }
.stop { fill: var(--stop); stroke: var(--stop-line); stroke-width: 1.2; }
.t { fill: var(--title); font-size: 14px; font-weight: 600; text-anchor: middle; }
.s { fill: var(--sub); font-size: 12px; text-anchor: middle; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.back { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; }
.el { fill: var(--sub); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.el-band { stroke: var(--band); }
.bl { fill: var(--accent); }
.head { fill: var(--line); }
.head-back { fill: var(--accent); }
.life { stroke: var(--life); stroke-width: 1.2; stroke-dasharray: 4 4; }
.block { fill: none; stroke: var(--block); stroke-width: 1; }
.block-tag { fill: var(--block); }
.block-tag-text { fill: var(--bg); font-size: 11px; font-weight: 700; }
.block-label { fill: var(--label); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.block-split { stroke: var(--block); stroke-width: 1; stroke-dasharray: 5 4; }
.note { fill: var(--dec); stroke: var(--dec-line); }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-back" d="M0 0L10 5L0 10z"/></marker>
</defs>
  <rect class="bg" width="720" height="401" rx="12"/>
  <line class="life" x1="130.7" y1="68" x2="130.7" y2="385"/>
  <rect class="node" x="21.000000000000014" y="16" width="219.33333333333334" height="52" rx="8"/>
  <text class="t" x="130.66666666666669" y="47.0">Lead</text>
  <line class="life" x1="360" y1="68" x2="360" y2="385"/>
  <rect class="node" x="250.33333333333331" y="16" width="219.33333333333334" height="52" rx="8"/>
  <text class="t" x="360.0" y="47.0">Scheduler</text>
  <line class="life" x1="589.3" y1="68" x2="589.3" y2="385"/>
  <rect class="node" x="479.6666666666667" y="16" width="219.33333333333334" height="52" rx="8"/>
  <text class="t" x="589.3333333333334" y="47.0">Worker</text>
  <text class="el" x="245.3" y="98" text-anchor="middle" style="font-size:12px">1 task_request(assignee,</text>
  <text class="el" x="245.3" y="113" text-anchor="middle" style="font-size:12px">conversation, input, request_key)</text>
  <path class="edge" d="M130.7 122H358" marker-end="url(#a)"/>
  <text class="el" x="245.3" y="148" text-anchor="middle" style="font-size:12px">queued</text>
  <path class="back" d="M360 157H132.7" marker-end="url(#b)"/>
  <text class="el" x="474.7" y="183" text-anchor="middle" style="font-size:12px">2 run the task</text>
  <path class="edge" d="M360 192H587.3" marker-end="url(#a)"/>
  <text class="el" x="474.7" y="218" text-anchor="middle" style="font-size:12px">result</text>
  <path class="back" d="M589.3 227H362" marker-end="url(#b)"/>
  <rect class="node" x="228.6" y="241" width="262.9" height="25" rx="6"/>
  <text class="s" x="360" y="259" style="fill: var(--title)">post the result in the task conversation</text>
  <text class="el" x="245.3" y="290" text-anchor="middle" style="font-size:12px">3 notify: result ready</text>
  <path class="edge" d="M360 299H132.7" marker-end="url(#a)"/>
  <rect class="node" x="33.1" y="313" width="195.2" height="25" rx="6"/>
  <text class="s" x="130.7" y="331" style="fill: var(--title)">review the result (task_get)</text>
  <text class="el" x="245.3" y="362" text-anchor="middle" style="font-size:12px">4 task_report(body) to the original conversation</text>
  <path class="edge" d="M130.7 371H358" marker-end="url(#a)"/>
</svg>
