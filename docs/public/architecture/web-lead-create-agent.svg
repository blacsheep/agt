  <rect class="node" x="496" y="168" width="200" height="48" rx="8"/>
  <text class="t" x="596.0" y="188.0">Scheduler</text>
  <text class="s" x="596.0" y="206.0">授权、准入、领取 lead 任务</text>
  <rect class="node" x="24" y="268" width="200" height="64" rx="8"/>
  <text class="t" x="124.0" y="288.0">lead 配置</text>
  <text class="s" x="124.0" y="306.0">builtin_tools:</text>
  <text class="s" x="124.0" y="322.0">resource_management</text>
  <rect class="node" x="260" y="268" width="200" height="52" rx="8"/>
  <text class="t" x="360.0" y="290.0">Runtime / NativeRun</text>
  <text class="s" x="360.0" y="308.0">以 lead 的身份执行</text>
  <rect class="ext" x="496" y="268" width="200" height="40" rx="8"/>
  <text class="t" x="596.0" y="293.0">lead 使用的模型</text>
  <rect class="node" x="24" y="392" width="200" height="48" rx="8"/>
  <text class="t" x="124.0" y="421.0">调度结算与幂等发布</text>
  <rect class="node" x="260" y="392" width="200" height="48" rx="8"/>
  <text class="t" x="360.0" y="421.0">参数校验、审批、调度围栏</text>
  <rect class="node" x="496" y="392" width="200" height="60" rx="8"/>
  <text class="t" x="596.0" y="410.0">启用为可用队友</text>
  <text class="s" x="596.0" y="428.0">principal_create →</text>
  <text class="s" x="596.0" y="444.0">agent_bind → binding_list 核验</text>
  <rect class="node" x="260" y="476" width="200" height="48" rx="8"/>
  <text class="t" x="360.0" y="496.0">ToolService</text>
  <text class="s" x="360.0" y="514.0">固定 lead Actor + 能力校验</text>
  <rect class="node" x="24" y="564" width="200" height="48" rx="8"/>
  <text class="t" x="124.0" y="584.0">im/im.db</text>
  <text class="s" x="124.0" y="602.0">Agent 身份</text>
  <rect class="node" x="260" y="564" width="200" height="48" rx="8"/>
  <text class="t" x="360.0" y="584.0">Resources::write_with</text>
  <text class="s" x="360.0" y="602.0">资源锁、领域写入 → AgentStore</text>
  <rect class="node" x="496" y="564" width="200" height="48" rx="8"/>
  <text class="t" x="596.0" y="584.0">runtime/runtime.db</text>
  <text class="s" x="596.0" y="602.0">托管绑定 bindings</text>
  <rect class="ext" x="230" y="640" width="260" height="36" rx="8"/>
  <text class="s" x="360.0" y="662.0">agents/default/reviewer/agent.yaml</text>
  <rect class="end" x="230" y="700" width="260" height="48" rx="8"/>
  <text class="t" x="360.0" y="720.0">工具结果</text>
  <text class="s" x="360.0" y="738.0">配置摘要、revision 与 activation</text>
