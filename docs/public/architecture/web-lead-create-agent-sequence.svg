<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1404" width="720" height="1404" role="img" aria-labelledby="title desc">
  <title id="title">lead 创建 Agent 的完整时序</title>
  <desc id="desc">消息保存后启动调度，lead 的 NativeRun 请求模型并执行 framework_resource_write；审批与能力检查通过时写入 agent.yaml，要求成为可用队友时继续创建身份、绑定并核验；最后保存 Run 结果并幂等发布回复。</desc>
  <style>
svg { --bg: #fbfbfd; --band: #f2f1fb; --band-line: #dcd8f4; --node: #ffffff; --node-line: #b8b1ea;
  --ext: #f6f6f8; --ext-line: #c9c9d6; --dec: #fff8ec; --dec-line: #e2b766; --end: #eef6f1; --end-line: #8cc3a2;
  --stop: #fbefef; --stop-line: #e0a3a3; --title: #1f1f2e; --sub: #5d5d72; --label: #6e6a92; --line: #77778d;
  --accent: #7c6fe0; --life: #c7c4dc; --block: #8c88b0; }
@media (prefers-color-scheme: dark) {
  svg { --bg: #1c1c23; --band: #252432; --band-line: #3b3854; --node: #2d2c3c; --node-line: #5e57a8;
    --ext: #262630; --ext-line: #4a4a5e; --dec: #332c1f; --dec-line: #a3813f; --end: #1f2e26; --end-line: #4f8a66;
    --stop: #352223; --stop-line: #9a5c5c; --title: #ececf4; --sub: #a9a9bb; --label: #a39ee0; --line: #9a9ab0;
    --accent: #a99ff0; --life: #47455e; --block: #8f8ab8; }
}
text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.bg { fill: var(--bg); }
.band { fill: var(--band); stroke: var(--band-line); }
.band-label { fill: var(--label); font-size: 13px; font-weight: 600; }
.node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.2; }
.ext { fill: var(--ext); stroke: var(--ext-line); stroke-dasharray: 4 3; }
.dec { fill: var(--dec); stroke: var(--dec-line); stroke-width: 1.2; }
.end { fill: var(--end); stroke: var(--end-line); stroke-width: 1.2; }
.stop { fill: var(--stop); stroke: var(--stop-line); stroke-width: 1.2; }
.t { fill: var(--title); font-size: 14px; font-weight: 600; text-anchor: middle; }
.s { fill: var(--sub); font-size: 12px; text-anchor: middle; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.back { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; }
.el { fill: var(--sub); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.el-band { stroke: var(--band); }
.bl { fill: var(--accent); }
.head { fill: var(--line); }
.head-back { fill: var(--accent); }
.life { stroke: var(--life); stroke-width: 1.2; stroke-dasharray: 4 4; }
.block { fill: none; stroke: var(--block); stroke-width: 1; }
.block-tag { fill: var(--block); }
.block-tag-text { fill: var(--bg); font-size: 11px; font-weight: 700; }
.block-label { fill: var(--label); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.block-split { stroke: var(--block); stroke-width: 1; stroke-dasharray: 5 4; }
.note { fill: var(--dec); stroke: var(--dec-line); }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-back" d="M0 0L10 5L0 10z"/></marker>
</defs>
  <rect class="bg" width="720" height="1404" rx="12"/>
  <line class="life" x1="73.3" y1="82" x2="73.3" y2="1388"/>
  <rect class="node" x="21.000000000000007" y="16" width="104.66666666666667" height="66" rx="8"/>
  <text class="t" x="73.33333333333334" y="45.0">用户 / Web</text>
  <text class="s" x="73.33333333333334" y="63.0">agt web</text>
  <line class="life" x1="188" y1="82" x2="188" y2="1388"/>
  <rect class="node" x="135.66666666666666" y="16" width="104.66666666666667" height="66" rx="8"/>
  <text class="t" x="188.0" y="45.0">Service / IM</text>
  <text class="s" x="188.0" y="63.0">Rust</text>
  <line class="life" x1="302.7" y1="82" x2="302.7" y2="1388"/>
  <rect class="node" x="250.33333333333334" y="16" width="104.66666666666667" height="66" rx="8"/>
  <text class="t" x="302.6666666666667" y="54.0">Scheduler</text>
  <line class="life" x1="417.3" y1="82" x2="417.3" y2="1388"/>
  <rect class="node" x="365.00000000000006" y="16" width="104.66666666666667" height="66" rx="8"/>
  <text class="t" x="417.33333333333337" y="45.0">lead</text>
  <text class="s" x="417.33333333333337" y="63.0">NativeRun</text>
  <line class="life" x1="532" y1="82" x2="532" y2="1388"/>
  <rect class="node" x="479.6666666666667" y="16" width="104.66666666666667" height="66" rx="8"/>
  <text class="t" x="532.0" y="54.0">模型</text>
  <line class="life" x1="646.7" y1="82" x2="646.7" y2="1388"/>
  <rect class="node" x="594.3333333333334" y="16" width="104.66666666666667" height="66" rx="8"/>
  <text class="t" x="646.6666666666667" y="37.0">ToolService</text>
  <text class="s" x="646.6666666666667" y="55.0">Resources</text>
  <text class="s" x="646.6666666666667" y="71.0">与存储</text>
  <rect class="block" x="16" y="533" width="688" height="686" rx="4"/>
  <line class="block-split" x1="16" y1="1098" x2="704" y2="1098"/>
  <rect class="block" x="28" y="750" width="664" height="305" rx="4"/>
  <rect class="block" x="48" y="780" width="624" height="261" rx="4"/>
  <rect class="node" x="20" y="100" width="187.3" height="25" rx="6"/>
  <text class="s" x="113.6" y="118" style="fill: var(--title)">用户发送创建 reviewer 的消息</text>
  <text class="el" x="130.7" y="149" text-anchor="middle" style="font-size:12px">CLI tool call message_send</text>
  <path class="edge" d="M73.3 158H186" marker-end="url(#a)"/>
  <text class="el" x="130.7" y="184" text-anchor="middle" style="font-size:12px">已保存消息及 message ID</text>
  <path class="back" d="M188 193H75.3" marker-end="url(#b)"/>
  <text class="el" x="188" y="219" text-anchor="middle" style="font-size:12px">schedule start --message ID</text>
  <path class="edge" d="M73.3 228H300.7" marker-end="url(#a)"/>
  <rect class="node" x="208.7" y="242" width="188" height="25" rx="6"/>
  <text class="s" x="302.7" y="260" style="fill: var(--title)">扫描投递、校验授权、领取任务</text>
  <text class="el" x="360" y="291" text-anchor="middle" style="font-size:12px">RunRequest，trigger</text>
  <text class="el" x="360" y="306" text-anchor="middle" style="font-size:12px">principal = lead</text>
  <path class="edge" d="M302.7 315H415.3" marker-end="url(#a)"/>
  <rect class="node" x="348.2" y="329" width="138.3" height="40" rx="6"/>
  <text class="s" x="417.3" y="347" style="fill: var(--title)">加载配置、固定</text>
  <text class="s" x="417.3" y="362" style="fill: var(--title)">Actor、挂载资源工具</text>
  <text class="el" x="474.7" y="393" text-anchor="middle" style="font-size:12px">消息上下文与</text>
  <text class="el" x="474.7" y="408" text-anchor="middle" style="font-size:12px">framework 工具 schema</text>
  <path class="edge" d="M417.3 417H530" marker-end="url(#a)"/>
  <text class="el" x="474.7" y="443" text-anchor="middle" style="font-size:12px">framework_resource_write</text>
  <text class="el" x="474.7" y="458" text-anchor="middle" style="font-size:12px">调用</text>
  <path class="back" d="M532 467H419.3" marker-end="url(#b)"/>
  <rect class="node" x="326.1" y="481" width="182.5" height="40" rx="6"/>
  <text class="s" x="417.3" y="499" style="fill: var(--title)">校验参数、PermissionLoop、</text>
  <text class="s" x="417.3" y="514" style="fill: var(--title)">审计与围栏</text>
  <path class="block-tag" d="M16 533h29.8v14l-5 5h-24.8z"/>
  <text class="block-tag-text" x="23" y="546">alt</text>
  <text class="block-label" x="53.8" y="547">审批允许且 Service 能力检查通过</text>
  <text class="el" x="532" y="575" text-anchor="middle" style="font-size:12px">resource_write(kind=agent, create=true)</text>
  <path class="edge" d="M417.3 584H644.7" marker-end="url(#a)"/>
  <rect class="node" x="541.4" y="598" width="154.6" height="55" rx="6"/>
  <text class="s" x="618.7" y="616" style="fill: var(--title)">资源锁内校验配置与引用</text>
  <text class="s" x="618.7" y="631" style="fill: var(--title)">AgentStore::create_in</text>
  <text class="s" x="618.7" y="646" style="fill: var(--title)">原子写入 agent.yaml</text>
  <text class="el" x="532" y="677" text-anchor="middle" style="font-size:12px">摘要 + revision + activation + next_steps</text>
  <path class="back" d="M646.7 686H419.3" marker-end="url(#b)"/>
  <text class="el" x="474.7" y="712" text-anchor="middle" style="font-size:12px">工具结果；仅保存</text>
  <text class="el" x="474.7" y="727" text-anchor="middle" style="font-size:12px">定义时尚未启用</text>
  <path class="edge" d="M417.3 736H530" marker-end="url(#a)"/>
  <path class="block-tag" d="M28 750h32.5v14l-5 5h-27.5z"/>
  <text class="block-tag-text" x="35" y="763">opt</text>
  <text class="block-label" x="68.5" y="764">用户要求成为可用队友，模型继续完成启用</text>
  <path class="block-tag" d="M48 780h36v14l-5 5h-31z"/>
  <text class="block-tag-text" x="55" y="793">loop</text>
  <text class="block-label" x="92" y="794">按需查询、principal_create、agent_bind、binding_list</text>
  <text class="el" x="474.7" y="822" text-anchor="middle" style="font-size:12px">下一项 framework 工具调用</text>
  <path class="back" d="M532 831H419.3" marker-end="url(#b)"/>
  <rect class="node" x="341.3" y="845" width="152" height="25" rx="6"/>
  <text class="s" x="417.3" y="863" style="fill: var(--title)">校验、审批、审计与围栏</text>
  <text class="el" x="532" y="894" text-anchor="middle" style="font-size:12px">调用身份或绑定工具</text>
  <path class="edge" d="M417.3 903H644.7" marker-end="url(#a)"/>
  <rect class="node" x="536" y="917" width="128" height="40" rx="6"/>
  <text class="s" x="600" y="935" style="fill: var(--title)">读取状态、创建身份</text>
  <text class="s" x="600" y="950" style="fill: var(--title)">或保存绑定</text>
  <text class="el" x="532" y="981" text-anchor="middle" style="font-size:12px">实际存储结果</text>
  <path class="back" d="M646.7 990H419.3" marker-end="url(#b)"/>
  <text class="el" x="474.7" y="1016" text-anchor="middle" style="font-size:12px">结果进入上下文，继续决策</text>
  <path class="edge" d="M417.3 1025H530" marker-end="url(#a)"/>
  <text class="el" x="474.7" y="1079" text-anchor="middle" style="font-size:12px">根据实际结果生成回答</text>
  <path class="back" d="M532 1088H419.3" marker-end="url(#b)"/>
  <path class="block-tag" d="M16 1102h36v14l-5 5h-31z"/>
  <text class="block-tag-text" x="23" y="1115">else</text>
  <text class="block-label" x="60" y="1116">审批拒绝或工具业务错误</text>
  <text class="el" x="474.7" y="1144" text-anchor="middle" style="font-size:12px">返回拒绝或错误，</text>
  <text class="el" x="474.7" y="1159" text-anchor="middle" style="font-size:12px">不能报告创建成功</text>
  <path class="edge" d="M417.3 1168H530" marker-end="url(#a)"/>
  <text class="el" x="474.7" y="1194" text-anchor="middle" style="font-size:12px">修正参数继续，或说明失败</text>
  <path class="back" d="M532 1203H419.3" marker-end="url(#b)"/>
  <text class="el" x="360" y="1243" text-anchor="middle" style="font-size:12px">保存并返回 Run 结果</text>
  <path class="back" d="M417.3 1252H304.7" marker-end="url(#b)"/>
  <text class="el" x="245.3" y="1278" text-anchor="middle" style="font-size:12px">复查围栏并幂等发布回复</text>
  <path class="edge" d="M302.7 1287H190" marker-end="url(#a)"/>
  <text class="el" x="130.7" y="1313" text-anchor="middle" style="font-size:12px">变化经事件投影</text>
  <text class="el" x="130.7" y="1328" text-anchor="middle" style="font-size:12px">与 SSE 触发刷新</text>
  <path class="back" d="M188 1337H75.3" marker-end="url(#b)"/>
  <rect class="node" x="20" y="1351" width="147.7" height="25" rx="6"/>
  <text class="s" x="93.8" y="1369" style="fill: var(--title)">向用户显示 lead 的回复</text>
</svg>
