<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Native 执行循环</title>
  <desc id="desc">每轮先检查取消与执行资格，再请求模型；工具调用整批校验后逐项审批执行。本批次写入自身 MCP/Skill 时在批次结束后刷新能力；成功或失败都回到下一次模型请求。</desc>
  <style>
svg { --bg: #fbfbfd; --band: #f2f1fb; --band-line: #dcd8f4; --node: #ffffff; --node-line: #b8b1ea;
  --ext: #f6f6f8; --ext-line: #c9c9d6; --dec: #fff8ec; --dec-line: #e2b766; --end: #eef6f1; --end-line: #8cc3a2;
  --stop: #fbefef; --stop-line: #e0a3a3; --title: #1f1f2e; --sub: #5d5d72; --label: #6e6a92; --line: #77778d;
  --accent: #7c6fe0; --life: #c7c4dc; --block: #8c88b0; }
@media (prefers-color-scheme: dark) {
  svg { --bg: #1c1c23; --band: #252432; --band-line: #3b3854; --node: #2d2c3c; --node-line: #5e57a8;
    --ext: #262630; --ext-line: #4a4a5e; --dec: #332c1f; --dec-line: #a3813f; --end: #1f2e26; --end-line: #4f8a66;
    --stop: #352223; --stop-line: #9a5c5c; --title: #ececf4; --sub: #a9a9bb; --label: #a39ee0; --line: #9a9ab0;
    --accent: #a99ff0; --life: #47455e; --block: #8f8ab8; }
}
text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.bg { fill: var(--bg); }
.band { fill: var(--band); stroke: var(--band-line); }
.band-label { fill: var(--label); font-size: 13px; font-weight: 600; }
.node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.2; }
.ext { fill: var(--ext); stroke: var(--ext-line); stroke-dasharray: 4 3; }
.dec { fill: var(--dec); stroke: var(--dec-line); stroke-width: 1.2; }
.end { fill: var(--end); stroke: var(--end-line); stroke-width: 1.2; }
.stop { fill: var(--stop); stroke: var(--stop-line); stroke-width: 1.2; }
.t { fill: var(--title); font-size: 14px; font-weight: 600; text-anchor: middle; }
.s { fill: var(--sub); font-size: 12px; text-anchor: middle; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.back { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; }
.el { fill: var(--sub); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.el-band { stroke: var(--band); }
.bl { fill: var(--accent); }
.head { fill: var(--line); }
.head-back { fill: var(--accent); }
.life { stroke: var(--life); stroke-width: 1.2; stroke-dasharray: 4 4; }
.block { fill: none; stroke: var(--block); stroke-width: 1; }
.block-tag { fill: var(--block); }
.block-tag-text { fill: var(--bg); font-size: 11px; font-weight: 700; }
.block-label { fill: var(--label); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.block-split { stroke: var(--block); stroke-width: 1; stroke-dasharray: 5 4; }
.note { fill: var(--dec); stroke: var(--dec-line); }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-back" d="M0 0L10 5L0 10z"/></marker>
</defs>
  <rect class="bg" width="720" height="720" rx="12"/>
  <rect class="node" x="36" y="16" width="204" height="48" rx="8"/>
  <text class="t" x="138.0" y="36.0">加载配置快照</text>
  <text class="s" x="138.0" y="54.0">准备上下文、工具和权限</text>
  <rect class="node" x="36" y="90" width="204" height="48" rx="8"/>
  <text class="t" x="138.0" y="110.0">检查取消与执行资格</text>
  <text class="s" x="138.0" y="128.0">必要时压缩上下文</text>
  <rect class="node" x="36" y="164" width="204" height="48" rx="8"/>
  <text class="t" x="138.0" y="193.0">请求模型</text>
  <rect class="stop" x="290" y="170" width="206" height="36" rx="18.0"/>
  <text class="t" x="393.0" y="193.0">请求失败或取消 → 终态</text>
  <rect class="dec" x="36" y="238" width="204" height="48" rx="8"/>
  <text class="t" x="138.0" y="267.0">返回类型？</text>
  <rect class="node" x="290" y="238" width="206" height="48" rx="8"/>
  <text class="t" x="393.0" y="258.0">整批校验 → 逐项权限检查</text>
  <text class="s" x="393.0" y="276.0">审计 → 执行工具 → 保存结果</text>
  <rect class="stop" x="520" y="244" width="180" height="36" rx="18.0"/>
  <text class="t" x="610.0" y="267.0">致命错误或取消 → 终态</text>
  <rect class="dec" x="36" y="312" width="204" height="48" rx="8"/>
  <text class="t" x="138.0" y="341.0">还有可接纳的新输入？</text>
  <rect class="dec" x="290" y="312" width="206" height="48" rx="8"/>
  <text class="t" x="393.0" y="341.0">工具要求挂起？</text>
  <rect class="end" x="520" y="312" width="180" height="48" rx="8"/>
  <text class="t" x="610.0" y="332.0">保存检查点</text>
  <text class="s" x="610.0" y="350.0">返回 suspended</text>
  <rect class="end" x="36" y="386" width="204" height="48" rx="8"/>
  <text class="t" x="138.0" y="415.0">保存 Run 终态</text>
  <rect class="node" x="290" y="386" width="206" height="48" rx="8"/>
  <text class="t" x="393.0" y="415.0">工具结果加入上下文</text>
  <rect class="dec" x="290" y="460" width="206" height="48" rx="8"/>
  <text class="t" x="393.0" y="480.0">本批次成功写入了自</text>
  <text class="t" x="393.0" y="498.0">身 MCP / Skill 配置？</text>
  <rect class="node" x="520" y="452" width="180" height="64" rx="8"/>
  <text class="t" x="610.0" y="472.0">准备候选能力</text>
  <text class="s" x="610.0" y="490.0">检查模型工具能力、连</text>
  <text class="s" x="610.0" y="506.0">接、schema 与工具数量</text>
  <rect class="stop" x="290" y="540" width="206" height="36" rx="18.0"/>
  <text class="t" x="393.0" y="563.0">取消或失去执行资格 → 终态</text>
  <rect class="dec" x="520" y="540" width="180" height="36" rx="8"/>
  <text class="t" x="610.0" y="563.0">候选能力就绪？</text>
  <rect class="node" x="290" y="616" width="206" height="48" rx="8"/>
  <text class="t" x="393.0" y="636.0">切换能力快照与系统提示词</text>
  <text class="s" x="393.0" y="654.0">更新执行指纹，报告 applied</text>
  <rect class="node" x="520" y="616" width="180" height="48" rx="8"/>
  <text class="t" x="610.0" y="636.0">保留旧能力</text>
  <text class="s" x="610.0" y="654.0">配置仍已保存，报告 failed</text>
  <path class="edge" d="M138 65L138 88" marker-end="url(#a)"/>
  <path class="edge" d="M138 139L138 162" marker-end="url(#a)"/>
  <path class="edge" d="M138 213L138 236" marker-end="url(#a)"/>
  <path class="edge" d="M138 287L138 310" marker-end="url(#a)"/>
  <text class="el" x="146.0" y="302" text-anchor="start">最终回答</text>
  <path class="edge" d="M138 361L138 384" marker-end="url(#a)"/>
  <text class="el" x="146.0" y="376" text-anchor="start">无</text>
  <path class="edge" d="M241 188L288 188" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path class="edge" d="M241 262L288 262" marker-end="url(#a)"/>
  <text class="el" x="265.0" y="256.0" text-anchor="middle">工具调用</text>
  <path class="edge" d="M497 262L518 262" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path class="edge" d="M393 287L393 310" marker-end="url(#a)"/>
  <path class="edge" d="M497 336L518 336" marker-end="url(#a)"/>
  <text class="el" x="508.0" y="330.0" text-anchor="middle">是</text>
  <path class="edge" d="M393 361L393 384" marker-end="url(#a)"/>
  <text class="el" x="401.0" y="376" text-anchor="start">否</text>
  <path class="edge" d="M393 435L393 458" marker-end="url(#a)"/>
  <path class="edge" d="M497 484L518 484" marker-end="url(#a)"/>
  <text class="el" x="508.0" y="478" text-anchor="middle">是</text>
  <path class="edge" d="M610 517L610 538" marker-end="url(#a)"/>
  <path class="edge" d="M519 513L399 513Q393 513 393 519L393 538" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path class="edge" d="M610 577L610 614" marker-end="url(#a)"/>
  <text class="el" x="618.0" y="606" text-anchor="start">加载失败</text>
  <path class="edge" d="M550 577L550 584Q550 590 544 590L399 590Q393 590 393 596L393 614" marker-end="url(#a)"/>
  <text class="el" x="401.0" y="606" text-anchor="start">是</text>
  <path class="back" d="M393 665L393 686"/>
  <path class="back" d="M610 665L610 686"/>
  <path class="back" d="M610 686L26 686Q20 686 20 680L20 120Q20 114 26 114L34 114" marker-end="url(#b)"/>
  <path class="back" d="M289 484L20 484"/>
  <text class="el bl" x="276" y="478" text-anchor="end">否</text>
  <path class="back" d="M35 336L20 336"/>
  <text class="el bl" x="32" y="330" text-anchor="end">有</text>
  <text class="el bl" x="298" y="704" text-anchor="start">回到下一次模型请求之前</text>
</svg>
