<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 914" width="720" height="914" role="img" aria-labelledby="title desc">
  <title id="title">Native 自身能力刷新时序</title>
  <desc id="desc">模型通过 resource_write 修改自身能力后，配置先保存；本批次剩余调用仍用旧能力，批次结束后加载候选能力。加载成功则切换并报告 applied，失败保留旧能力并报告 failed，取消或失去执行资格则终止。</desc>
  <style>
svg { --bg: #fbfbfd; --band: #f2f1fb; --band-line: #dcd8f4; --node: #ffffff; --node-line: #b8b1ea;
  --ext: #f6f6f8; --ext-line: #c9c9d6; --dec: #fff8ec; --dec-line: #e2b766; --end: #eef6f1; --end-line: #8cc3a2;
  --stop: #fbefef; --stop-line: #e0a3a3; --title: #1f1f2e; --sub: #5d5d72; --label: #6e6a92; --line: #77778d;
  --accent: #7c6fe0; --life: #c7c4dc; --block: #8c88b0; }
@media (prefers-color-scheme: dark) {
  svg { --bg: #1c1c23; --band: #252432; --band-line: #3b3854; --node: #2d2c3c; --node-line: #5e57a8;
    --ext: #262630; --ext-line: #4a4a5e; --dec: #332c1f; --dec-line: #a3813f; --end: #1f2e26; --end-line: #4f8a66;
    --stop: #352223; --stop-line: #9a5c5c; --title: #ececf4; --sub: #a9a9bb; --label: #a39ee0; --line: #9a9ab0;
    --accent: #a99ff0; --life: #47455e; --block: #8f8ab8; }
}
text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.bg { fill: var(--bg); }
.band { fill: var(--band); stroke: var(--band-line); }
.band-label { fill: var(--label); font-size: 13px; font-weight: 600; }
.node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.2; }
.ext { fill: var(--ext); stroke: var(--ext-line); stroke-dasharray: 4 3; }
.dec { fill: var(--dec); stroke: var(--dec-line); stroke-width: 1.2; }
.end { fill: var(--end); stroke: var(--end-line); stroke-width: 1.2; }
.stop { fill: var(--stop); stroke: var(--stop-line); stroke-width: 1.2; }
.t { fill: var(--title); font-size: 14px; font-weight: 600; text-anchor: middle; }
.s { fill: var(--sub); font-size: 12px; text-anchor: middle; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.back { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; }
.el { fill: var(--sub); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.el-band { stroke: var(--band); }
.bl { fill: var(--accent); }
.head { fill: var(--line); }
.head-back { fill: var(--accent); }
.life { stroke: var(--life); stroke-width: 1.2; stroke-dasharray: 4 4; }
.block { fill: none; stroke: var(--block); stroke-width: 1; }
.block-tag { fill: var(--block); }
.block-tag-text { fill: var(--bg); font-size: 11px; font-weight: 700; }
.block-label { fill: var(--label); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.block-split { stroke: var(--block); stroke-width: 1; stroke-dasharray: 5 4; }
.note { fill: var(--dec); stroke: var(--dec-line); }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-back" d="M0 0L10 5L0 10z"/></marker>
</defs>
  <rect class="bg" width="720" height="914" rx="12"/>
  <line class="life" x1="102" y1="68" x2="102" y2="898"/>
  <rect class="node" x="21.0" y="16" width="162.0" height="52" rx="8"/>
  <text class="t" x="102.0" y="47.0">模型</text>
  <line class="life" x1="274" y1="68" x2="274" y2="898"/>
  <rect class="node" x="193.0" y="16" width="162.0" height="52" rx="8"/>
  <text class="t" x="274.0" y="47.0">Native 工具批次</text>
  <line class="life" x1="446" y1="68" x2="446" y2="898"/>
  <rect class="node" x="365.0" y="16" width="162.0" height="52" rx="8"/>
  <text class="t" x="446.0" y="47.0">Resources</text>
  <line class="life" x1="618" y1="68" x2="618" y2="898"/>
  <rect class="node" x="537.0" y="16" width="162.0" height="52" rx="8"/>
  <text class="t" x="618.0" y="47.0">候选能力加载</text>
  <rect class="block" x="16" y="500" width="688" height="386" rx="4"/>
  <line class="block-split" x1="16" y1="815" x2="704" y2="815"/>
  <line class="block-split" x1="16" y1="648" x2="704" y2="648"/>
  <rect class="block" x="16" y="404" width="688" height="84" rx="4"/>
  <text class="el" x="188" y="98" text-anchor="middle" style="font-size:12px">framework_resource_write</text>
  <text class="el" x="188" y="113" text-anchor="middle" style="font-size:12px">修改自身能力</text>
  <path class="edge" d="M102 122H272" marker-end="url(#a)"/>
  <text class="el" x="360" y="148" text-anchor="middle" style="font-size:12px">权限通过后保存配置</text>
  <path class="edge" d="M274 157H444" marker-end="url(#a)"/>
  <text class="el" x="360" y="183" text-anchor="middle" style="font-size:12px">保存成功与 revision</text>
  <path class="back" d="M446 192H276" marker-end="url(#b)"/>
  <rect class="node" x="165.8" y="206" width="216.3" height="25" rx="6"/>
  <text class="s" x="274" y="224" style="fill: var(--title)">记录 runtime_application=pending</text>
  <rect class="node" x="186" y="243" width="176" height="25" rx="6"/>
  <text class="s" x="274" y="261" style="fill: var(--title)">用旧能力完成本批次剩余调用</text>
  <text class="el" x="446" y="292" text-anchor="middle" style="font-size:12px">批次结束，读取 MCP/Skill 候选配置</text>
  <path class="edge" d="M274 301H616" marker-end="url(#a)"/>
  <rect class="node" x="540.2" y="315" width="155.6" height="40" rx="6"/>
  <text class="s" x="618" y="333" style="fill: var(--title)">保留当前模型、Provider</text>
  <text class="s" x="618" y="348" style="fill: var(--title)">基础 Prompt 和内置能力</text>
  <rect class="node" x="443.8" y="367" width="256.2" height="25" rx="6"/>
  <text class="s" x="571.9" y="385" style="fill: var(--title)">检查模型工具能力，按 Agent 装配加载 MCP</text>
  <path class="block-tag" d="M16 404h32.5v14l-5 5h-27.5z"/>
  <text class="block-tag-text" x="23" y="417">opt</text>
  <text class="block-label" x="56.5" y="418">MCP 配置或挂载变化</text>
  <rect class="node" x="532" y="434" width="164" height="40" rx="6"/>
  <text class="s" x="614" y="452" style="fill: var(--title)">连接服务、获取 schema</text>
  <text class="s" x="614" y="467" style="fill: var(--title)">检查工具数量并编译校验器</text>
  <path class="block-tag" d="M16 500h29.8v14l-5 5h-24.8z"/>
  <text class="block-tag-text" x="23" y="513">alt</text>
  <text class="block-label" x="53.8" y="514">加载成功，且取消与执行资格检查通过</text>
  <text class="el" x="446" y="542" text-anchor="middle" style="font-size:12px">候选提示词与可选工具快照</text>
  <path class="back" d="M618 551H276" marker-end="url(#b)"/>
  <rect class="node" x="198" y="565" width="152" height="25" rx="6"/>
  <text class="s" x="274" y="583" style="fill: var(--title)">更新执行指纹，切换能力</text>
  <text class="el" x="188" y="614" text-anchor="middle" style="font-size:12px">写入结果 + 独立 applied 通知</text>
  <text class="el" x="188" y="629" text-anchor="middle" style="font-size:12px">+ 当前工具 schema</text>
  <path class="edge" d="M274 638H104" marker-end="url(#a)"/>
  <path class="block-tag" d="M16 652h36v14l-5 5h-31z"/>
  <text class="block-tag-text" x="23" y="665">else</text>
  <text class="block-label" x="60" y="666">加载失败</text>
  <text class="el" x="446" y="694" text-anchor="middle" style="font-size:12px">失败原因</text>
  <path class="back" d="M618 703H276" marker-end="url(#b)"/>
  <rect class="node" x="192" y="717" width="164" height="40" rx="6"/>
  <text class="s" x="274" y="735" style="fill: var(--title)">保留旧能力，记录失败审计</text>
  <text class="s" x="274" y="750" style="fill: var(--title)">不撤销已保存配置</text>
  <text class="el" x="188" y="781" text-anchor="middle" style="font-size:12px">写入结果 + 独立 failed 通知</text>
  <text class="el" x="188" y="796" text-anchor="middle" style="font-size:12px">+ 旧工具 schema</text>
  <path class="edge" d="M274 805H104" marker-end="url(#a)"/>
  <path class="block-tag" d="M16 819h36v14l-5 5h-31z"/>
  <text class="block-tag-text" x="23" y="832">else</text>
  <text class="block-label" x="60" y="833">取消或失去执行资格</text>
  <text class="el" x="446" y="861" text-anchor="middle" style="font-size:12px">终止刷新与执行</text>
  <path class="back" d="M618 870H276" marker-end="url(#b)"/>
</svg>
