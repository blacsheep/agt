[package]
name = "agt-desktop"
description = "AGT Studio: the agt console as a desktop app, with tray, notifications and updates"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "agt-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
agt-cli.workspace = true
agt-console.workspace = true
anyhow.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.7"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { workspace = true, features = ["sync"] }

# Released by its own workflow (Tauri bundles), not by cargo-dist.
[package.metadata.dist]
dist = false
