[package]
name = "agt-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
version.workspace = true

[[bin]]
name = "agt"
path = "src/main.rs"

[dependencies]
serde_yaml.workspace = true
agt-harness.workspace = true
agt-agent.workspace = true
agt-config.workspace = true
agt-core.workspace = true
agt-im.workspace = true
agt-model.workspace = true
agt-mcp.workspace = true
agt-provider.workspace = true
agt-prompt.workspace = true
agt-runtime.workspace = true
agt-service.workspace = true
agt-skill.workspace = true
agt-storage.workspace = true
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "net", "signal", "io-util"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The workspace is not published to crates.io, but this binary is released on GitHub.
[package.metadata.dist]
dist = true
